on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Number of fresh-process runs per mode
        required: false
        default: "10"
  pull_request:
    branches: [development]

name: cmdstanr-model-methods-diagnostic.yaml

permissions: read-all

jobs:
  diagnose:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mode:
          - cmdstanr_only
          - mixed

    name: ubuntu-latest (${{ matrix.mode }})

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Add Stan R package repository
        run: |
          echo 'options(repos = c(stan = "https://mc-stan.org/r-packages/", getOption("repos")))' >> ~/.Rprofile
          echo "RENV_CONFIG_REPOS_OVERRIDE=STAN=https://mc-stan.org/r-packages/;CRAN=${RSPM:-https://cloud.r-project.org}" >> "$GITHUB_ENV"
          Rscript -e 'print(getOption("repos")); cat(Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"), "\n")'
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::cmdstanr, any::posterior
          needs: check

      - name: Install CmdStan
        run: |
          cmdstan_dir <- cmdstanr::install_cmdstan(cores = 2, overwrite = FALSE)
          cmdstanr::set_cmdstan_path(cmdstan_dir)
          cat("CmdStan path:", cmdstanr::cmdstan_path(), "\n")
          cat("CmdStan version:", cmdstanr::cmdstan_version(), "\n")
        shell: Rscript {0}

      - name: Run model-method diagnostic loop
        shell: bash
        run: |
          set -u
          mode="${{ matrix.mode }}"
          reps="${{ inputs.repetitions }}"
          mkdir -p diagnostics
          summary_file="diagnostics/${mode}_summary.tsv"
          printf "run\texit_code\tresult\n" > "$summary_file"
          failures=0

          echo "# CmdStanR model-method diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          printf -- "- mode: \`%s\`\n" "$mode" >> "$GITHUB_STEP_SUMMARY"
          printf -- "- repetitions: \`%s\`\n" "$reps" >> "$GITHUB_STEP_SUMMARY"

          for i in $(seq 1 "$reps"); do
            log_file="diagnostics/${mode}_run_${i}.log"
            echo "Running ${mode} iteration ${i}/${reps}"
            set +e
            Rscript .github/scripts/diagnose_cmdstanr_model_methods.R --mode "$mode" >"$log_file" 2>&1
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              result="success"
            else
              result="failure"
              failures=$((failures + 1))
            fi

            printf "%s\t%s\t%s\n" "$i" "$status" "$result" >> "$summary_file"
            echo "iteration ${i}: exit=${status} result=${result}"
          done

          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```tsv' >> "$GITHUB_STEP_SUMMARY"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf -- "- failures: \`%s/%s\`\n" "$failures" "$reps" >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmdstanr-model-methods-diagnostic-${{ matrix.mode }}
          path: diagnostics
