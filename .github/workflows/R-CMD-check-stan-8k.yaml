on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

name: R-CMD-check-stan-8k.yaml

permissions: read-all

jobs:
  rstan-8k-tests:
    runs-on: ubuntu-latest

    name: ubuntu-latest (rstan 8k tests)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      STANPOP_RUN_STAN_TESTS: "true"
      STANPOP_RUN_RSTAN_TESTS: "true"
      STANPOP_RUN_8K_RSTAN_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Add Stan R package repository
        run: |
          echo 'options(repos = c(stan = "https://mc-stan.org/r-packages/", getOption("repos")))' >> ~/.Rprofile
          echo "RENV_CONFIG_REPOS_OVERRIDE=STAN=https://mc-stan.org/r-packages/;CRAN=${RSPM:-https://cloud.r-project.org}" >> "$GITHUB_ENV"
          Rscript -e 'print(getOption("repos")); cat(Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"), "\n")'
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: test

      - name: Run model8k test file
        run: |
          pkgload::load_all(".", quiet = TRUE)
          testthat::test_dir(
            "tests/testthat",
            filter = "^test-model8k[.]R$",
            reporter = testthat::SummaryReporter$new()
          )
        shell: Rscript {0}

      - name: Show session info
        if: always()
        run: sessionInfo()
        shell: Rscript {0}
